<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BookLy - Cadastre seu livro</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <nav class="navbar">
        <a href="catalogo.html" class="navbar-logo">
            <span class="logo-book">Book</span><span class="logo-ly">Ly</span>
        </a>
        <ul class="nav-links">
            <li><a href="catalogo.html">Catálogo</a></li>
            <li><a href="cadastro-step1.html" class="active">Cadastrar Livro</a></li>
            <li><a href="planos.html">Planos</a></li>
        </ul>
        <button class="hamburger" id="hamburger" aria-label="Menu">
            <span></span><span></span><span></span>
        </button>
    </nav>

    <div class="sidebar" id="sidebar">
        <a href="catalogo.html">Catálogo</a>
        <a href="cadastro-step1.html" class="active">Cadastrar Livro</a>
        <a href="cadastro-step2.html">Estado do Exemplar</a>
        <a href="cadastro-step3.html">Preço/Foto</a>
        <a href="planos.html">Planos</a>
    </div>
    <div class="overlay" id="overlay"></div>

    <div class="card">
        <div class="progress-bar">
            <div class="step active">
                <div class="circle">1</div>
                <span>Informações Básicas</span>
            </div>
            <div class="line"></div>
            <div class="step">
                <div class="circle">2</div>
                <span>Características Físicas</span>
            </div>
            <div class="line"></div>
            <div class="step">
                <div class="circle">3</div>
                <span>Preço/Foto</span>
            </div>
        </div>

        <h1 class="page-title">Cadastre seu livro</h1>

        <div class="photo-area">
            <button type="button" class="photo-btn" id="addPhotoBtn">📷 Add foto</button>
            <input type="file" id="photoInput" accept="image/*" style="display:none;">
        </div>

        <div class="form-section">
            <h2 class="section-title">Detalhes</h2>

            <div class="form-group full">
                <label for="nome">Título do livro</label>
                <input type="text" id="nome" placeholder="escreva o nome do livro">
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="autor">Autores</label>
                    <input type="text" id="autor" placeholder="escreva o autor(es)">
                </div>
                <div class="form-group">
                    <label for="editora">Editora</label>
                    <input type="text" id="editora" placeholder="escreva a editora">
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="genero">Gênero</label>
                    <select id="genero">
                        <option value="">escolha o Gênero</option>
                        <option value="Romance">Romance</option>
                        <option value="Ficção científica">Ficção científica</option>
                        <option value="Fantasia">Fantasia</option>
                        <option value="Biografia">Biografia</option>
                        <option value="Terror">Terror</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="id_categoria">Categoria</label>
                    <select id="id_categoria">
                        <option value="">escolha a categoria</option>
                    </select>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="ano_publicacao">Ano de publicação</label>
                    <input type="number" id="ano_publicacao" placeholder="AAAA" min="1000" max="2099">
                </div>
                <div class="form-group">
                    <label>ISBN</label>
                    <input type="text" id="isbn" placeholder="Digite o ISBN">
                    <div class="checkbox-row">
                        <label class="check-label">
                            <input type="radio" name="isbn_check" value="possui" checked> possui
                        </label>
                        <label class="check-label">
                            <input type="radio" name="isbn_check" value="nao_possui"> não possui
                        </label>
                    </div>
                </div>
            </div>
        </div>

        <div class="actions">
            <button type="button" class="btn-back" id="voltarBtn">Voltar</button>
            <span class="step-text">Passo 1 de 3</span>
            <button type="button" class="btn-next" id="continuarBtn">Continuar</button>
        </div>

        <div class="message" id="message"></div>
    </div>

    <script src="js/nav.js"></script>
    <script src="js/Categoria.js"></script>
    <script src="js/Livro.js"></script>
    <script>Livro.initStep1();</script>
</body>
</html>
