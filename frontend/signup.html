<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BookLy - Cadastro de Conta</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <nav class="navbar">
        <a href="catalogo.html" class="navbar-logo">
            <span class="logo-book">Book</span><span class="logo-ly">Ly</span>
        </a>
        <ul class="nav-links">
            <li><a href="catalogo.html">Catálogo</a></li>
            <li><a href="planos.html">Planos</a></li>
        </ul>
        <button class="hamburger" id="hamburger" aria-label="Menu">
            <span></span><span></span><span></span>
        </button>
    </nav>

    <div class="sidebar" id="sidebar">
        <a href="catalogo.html">Catálogo</a>
        <a href="planos.html">Planos</a>
    </div>
    <div class="overlay" id="overlay"></div>

    <div class="card" style="max-width:560px;">
        <h1 class="page-title">Criar Conta</h1>

        <div class="tipo-toggle">
            <button type="button" class="active" data-tipo="comprador">Comprador</button>
            <button type="button" data-tipo="livreiro">Vendedor</button>
        </div>

        <form id="signupForm">
            <h2 class="section-title">Dados Pessoais</h2>

            <div class="form-grid-2">
                <div class="form-group">
                    <label for="primeiro_nome">Primeiro nome *</label>
                    <input type="text" id="primeiro_nome" placeholder="Seu nome" required>
                </div>
                <div class="form-group">
                    <label for="segundo_nome">Sobrenome</label>
                    <input type="text" id="segundo_nome" placeholder="Seu sobrenome">
                </div>
            </div>

            <div class="form-grid-2">
                <div class="form-group">
                    <label for="login">Login *</label>
                    <input type="text" id="login" placeholder="Escolha um login" required>
                </div>
                <div class="form-group">
                    <label for="usuario">Usuário *</label>
                    <input type="text" id="usuario" placeholder="Nome de usuário" required>
                </div>
            </div>

            <div class="form-grid-2">
                <div class="form-group">
                    <label for="senha">Senha *</label>
                    <input type="password" id="senha" placeholder="Mínimo 6 caracteres" required>
                </div>
                <div class="form-group">
                    <label for="cpf">CPF *</label>
                    <input type="text" id="cpf" placeholder="00000000000" maxlength="11" required>
                </div>
            </div>

            <div class="form-grid-2">
                <div class="form-group">
                    <label for="email">E-mail *</label>
                    <input type="email" id="email" placeholder="seu@email.com" required>
                </div>
                <div class="form-group">
                    <label for="telefone">Telefone</label>
                    <input type="text" id="telefone" placeholder="(00) 00000-0000">
                </div>
            </div>

            <div class="form-group full">
                <label for="data_nascimento">Data de nascimento</label>
                <input type="date" id="data_nascimento">
            </div>

            <div class="address-section">
                <h3>Endereço (opcional)</h3>
                <div class="form-grid-2">
                    <div class="form-group">
                        <label for="endereco_cep">CEP</label>
                        <input type="text" id="endereco_cep" placeholder="00000-000">
                    </div>
                    <div class="form-group">
                        <label for="endereco_estado">Estado</label>
                        <select id="endereco_estado">
                            <option value="">--</option>
                            <option value="AC">AC</option><option value="AL">AL</option>
                            <option value="AP">AP</option><option value="AM">AM</option>
                            <option value="BA">BA</option><option value="CE">CE</option>
                            <option value="DF">DF</option><option value="ES">ES</option>
                            <option value="GO">GO</option><option value="MA">MA</option>
                            <option value="MT">MT</option><option value="MS">MS</option>
                            <option value="MG">MG</option><option value="PA">PA</option>
                            <option value="PB">PB</option><option value="PR">PR</option>
                            <option value="PE">PE</option><option value="PI">PI</option>
                            <option value="RJ">RJ</option><option value="RN">RN</option>
                            <option value="RS">RS</option><option value="RO">RO</option>
                            <option value="RR">RR</option><option value="SC">SC</option>
                            <option value="SP">SP</option><option value="SE">SE</option>
                            <option value="TO">TO</option>
                        </select>
                    </div>
                </div>
                <div class="form-group full">
                    <label for="endereco_rua">Rua</label>
                    <input type="text" id="endereco_rua" placeholder="Nome da rua">
                </div>
                <div class="form-grid-2">
                    <div class="form-group">
                        <label for="endereco_numero">Número</label>
                        <input type="text" id="endereco_numero" placeholder="Nº">
                    </div>
                    <div class="form-group">
                        <label for="endereco_bairro">Bairro</label>
                        <input type="text" id="endereco_bairro" placeholder="Bairro">
                    </div>
                </div>
                <div class="form-grid-2">
                    <div class="form-group">
                        <label for="endereco_cidade">Cidade</label>
                        <input type="text" id="endereco_cidade" placeholder="Cidade">
                    </div>
                    <div class="form-group">
                        <label for="endereco_complemento">Complemento</label>
                        <input type="text" id="endereco_complemento" placeholder="Apto, bloco, etc.">
                    </div>
                </div>
            </div>

            <div class="actions">
                <button type="button" class="btn-back" onclick="window.location.href='catalogo.html'">Voltar</button>
                <button type="submit" class="btn-next">Cadastrar</button>
            </div>
        </form>

        <div class="message" id="message"></div>
        <div class="auth-link">Já tem conta? <a href="login.html">Faça login</a></div>
    </div>

    <script src="js/nav.js"></script>
    <script src="js/Livreiro.js"></script>
    <script src="js/Comprador.js"></script>
    <script>
        var signupTipo = 'comprador';

        document.querySelectorAll('.tipo-toggle button').forEach(function(btn) {
            btn.addEventListener('click', function() {
                document.querySelectorAll('.tipo-toggle button').forEach(function(b) { b.classList.remove('active'); });
                btn.classList.add('active');
                signupTipo = btn.dataset.tipo;
            });
        });

        document.getElementById('signupForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            var msg = document.getElementById('message');
            msg.className = 'message loading';
            msg.textContent = 'Cadastrando...';

            var data = {
                login: document.getElementById('login').value.trim(),
                senha: document.getElementById('senha').value,
                usuario: document.getElementById('usuario').value.trim(),
                cpf: document.getElementById('cpf').value.trim().replace(/\D/g, ''),
                email: document.getElementById('email').value.trim(),
                primeiro_nome: document.getElementById('primeiro_nome').value.trim(),
                segundo_nome: document.getElementById('segundo_nome').value.trim() || null,
                telefone: document.getElementById('telefone').value.trim() || null,
                data_nascimento: document.getElementById('data_nascimento').value || null,
                endereco_rua: document.getElementById('endereco_rua').value.trim() || null,
                endereco_numero: document.getElementById('endereco_numero').value.trim() || null,
                endereco_complemento: document.getElementById('endereco_complemento').value.trim() || null,
                endereco_bairro: document.getElementById('endereco_bairro').value.trim() || null,
                endereco_cidade: document.getElementById('endereco_cidade').value.trim() || null,
                endereco_estado: document.getElementById('endereco_estado').value || null,
                endereco_cep: document.getElementById('endereco_cep').value.trim() || null
            };

            var result;
            if (signupTipo === 'livreiro') {
                result = await Livreiro.signup(data);
            } else {
                result = await Comprador.signup(data);
            }

            if (result.success) {
                msg.className = 'message success';
                msg.textContent = 'Conta criada! Bem-vindo, ' + result.nome + '!';
                setTimeout(function() { window.location.href = 'catalogo.html'; }, 1500);
            } else {
                msg.className = 'message error';
                if (result.message && (result.message.includes('conectar') || result.message.includes('Failed'))) {
                    msg.textContent = 'Não foi possível conectar ao backend. Verifique se o Flask está rodando na porta 5000.';
                } else if (result.message && (result.message.includes('409') || result.message.includes('Duplicate'))) {
                    msg.textContent = 'Login, usuário, CPF ou e-mail já cadastrado.';
                } else {
                    msg.textContent = result.message || 'Erro ao cadastrar.';
                }
            }
        });
    </script>
</body>
</html>
